name: Newman Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  newman-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Instalar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Instalar dependências
      run: |
        cd newman_tests
        npm ci

    - name: Correr testes Newman
      run: |
        cd newman_tests
        npm run test

    - name: Guardar relatório como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: newman-report
        path: newman_tests/reports/report.html
